name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            11.0.x

      - name: Compiler la solution
        run: dotnet build EventGhostDotNet.sln -c Release

      - name: Exécuter les tests
        run: dotnet test Tests/EventGhostDotNet.Core.Tests/EventGhostDotNet.Core.Tests.csproj -c Release --no-build

      - name: Publier l'application
        run: dotnet publish EventGhostDotNet.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish -p:DebugSymbols=false

      - name: Démarrer l'application (smoke)
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/publish/EventGhostDotNet.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
              throw "Exécutable publié introuvable : $exe"
          }

          $errorLog = Join-Path $env:LOCALAPPDATA 'EventGhostDotNet/logs/errors.log'
          Remove-Item -LiteralPath $errorLog -Force -ErrorAction SilentlyContinue

          $process = Start-Process -FilePath $exe -ArgumentList '--minimized' -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
              if (Test-Path -LiteralPath $errorLog) { Get-Content -LiteralPath $errorLog }
              throw "L'application s'est arrêtée au démarrage (code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()

          if (Test-Path -LiteralPath $errorLog) {
              Get-Content -LiteralPath $errorLog
              throw "L'application a écrit dans errors.log pendant le démarrage."
          }

      - name: Vérifier le chargement des plugins
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'artifacts/publish/EventGhostDotNet.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'smoke-plugins.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'smoke-plugins.err'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content -LiteralPath $stdout
          if ((Test-Path -LiteralPath $stderr) -and (Get-Item -LiteralPath $stderr).Length -gt 0) {
              Get-Content -LiteralPath $stderr
          }
          if ($process.ExitCode -ne 0) {
              throw "Le chargement des plugins a échoué (code $($process.ExitCode))."
          }

          # La sortie console est écrite dans la page de codes système : le « é » n'est pas
          # forcément de l'UTF-8, d'où le joker plutôt que le caractère accentué.
          if (-not (Select-String -LiteralPath $stdout -Pattern 'Plugins charg.s : 7 \(')) {
              throw "Les 7 plugins attendus n'ont pas tous été chargés."
          }
          foreach ($plugin in 'Display', 'FileWatcher', 'Logitech', 'ProcessWatcher',
                              'Scheduler', 'SystemTrayMenu', 'Wallpaper') {
              if (-not (Select-String -LiteralPath $stdout -SimpleMatch "($plugin).")) {
                  throw "Le plugin $plugin n'a pas été chargé."
              }
          }
